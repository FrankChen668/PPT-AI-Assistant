[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ppt-skill"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "cairosvg>=2.7.0",
  "defusedxml>=0.7.1",
  "lxml>=4.9.0",
  "Pillow>=10.0.0",
  "python-pptx>=0.6.21",
  "requests>=2.28.0",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23.0"]

# 本项目通过 sys.path 使用脚本目录（scripts/、ppt-ai-core/scripts/），
# 而非作为可安装的 Python 包分发。顶层有多个资源目录
# （agents/assets/projects/qa/templates/references/reference_cases），
# 会让 setuptools 的自动包发现报“Multiple top-level packages”错误。
# 这里显式声明“不打包任何子包”，使 `pip install -e .` 只安装依赖与项目元信息。
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# CI 护栏扩栏基线豁免（2026-07-28）：以下高 churn 脚本已整体纳入 ruff（E/F/I）门禁，
# 仅存量 E501（line-too-long）按基线豁免：qa_project.py 9 处、generate_slide_plan.py 2 处、
# build_project.py 1 处（ruff 0.15.12 实测）。退出条件：对应文件存量 E501 清零后删除该豁免行；
# 不得依赖此豁免新增长行。layout_renderers.py、svg_to_pptx.py 无需豁免。
[tool.ruff.lint.per-file-ignores]
"scripts/qa_project.py" = ["E501"]
"scripts/build_project.py" = ["E501"]
"scripts/generate_slide_plan.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
